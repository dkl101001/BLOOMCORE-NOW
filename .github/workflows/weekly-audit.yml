# SPDX-License-Identifier: Apache-2.0
name: Weekly Foundry Audit

on:
  schedule:
    - cron: "17 17 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-foundry-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every active release test
        run: python forge_tools/run_all_tests.py
      - name: Build every release integrity receipt
        run: |
          mkdir -p weekly-audit
          for release in releases/*; do
            test -d "$release" || continue
            name="${release##*/}"
            python forge_tools/build_release_receipt.py "$release" \
              --output "weekly-audit/${name}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-foundry-audit
          path: weekly-audit/
          if-no-files-found: error
