# SPDX-License-Identifier: Apache-2.0
name: Human-Approved Release

on:
  workflow_dispatch:
    inputs:
      release_directory:
        description: "Release directory beneath releases/"
        required: true
        default: "2026-W31-bloomcore-receipt"
        type: string
      tag:
        description: "Git tag to create"
        required: true
        default: "2026-W31-v0.1.0-rc1"
        type: string
      publish:
        description: "Publish the GitHub Release after validation"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: human-approved-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requested directory
        env:
          RELEASE_DIRECTORY: ${{ inputs.release_directory }}
        run: |
          case "$RELEASE_DIRECTORY" in
            *..*|/*|*\\*) echo "unsafe release directory"; exit 1 ;;
          esac
          test -d "releases/$RELEASE_DIRECTORY"
      - name: Run foundry tests
        run: python forge_tools/run_all_tests.py
      - name: Build integrity receipt
        env:
          RELEASE_DIRECTORY: ${{ inputs.release_directory }}
        run: >-
          python forge_tools/build_release_receipt.py
          "releases/$RELEASE_DIRECTORY"
          --output release-receipt.json
      - name: Package release
        env:
          RELEASE_DIRECTORY: ${{ inputs.release_directory }}
        run: |
          mkdir -p release-candidate
          tar -czf "release-candidate/${RELEASE_DIRECTORY}.tar.gz" \
            "releases/$RELEASE_DIRECTORY"
          cp release-receipt.json release-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: release-candidate/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_DIRECTORY: ${{ inputs.release_directory }}
        run: >-
          gh release create "$TAG"
          release-candidate/*
          --target "$GITHUB_SHA"
          --title "$RELEASE_DIRECTORY"
          --notes "Human-triggered BLOOMCORE NOW release. See RELEASE_RECEIPT.md and release-receipt.json."

