# SPDX-License-Identifier: Apache-2.0
name: Publish W36 Triad Workflow v0.1.0

on:
  push:
    branches:
      - release/2026-W36-triad-workflow-v0.1.0

permissions:
  contents: write

concurrency:
  group: publish-w36-triad-workflow-v0.1.0
  cancel-in-progress: false

jobs:
  verify-package-publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 410fa8251ec7d9b825d5ff82597f1e8458d35f81
      RELEASE_DIRECTORY: 2026-W36-triad-workflow
      TAG: 2026-W36-triad-workflow-v0.1.0
      ASSET: bloomcore-triad-workflow-v0.1.0.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind publisher to active main
        run: |
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = ".github/workflows/publish-w36-v0.1.0.yml"
      - name: Run foundry validation
        run: |
          git worktree add --detach /tmp/w36-source "$SOURCE_SHA"
          cd /tmp/w36-source
          python -m compileall -q forge_tools releases
          python forge_tools/run_all_tests.py
      - name: Build and verify the single ZIP
        run: |
          git archive --format=zip -0             --prefix=bloomcore-triad-workflow-v0.1.0/             -o "$ASSET.a"             "$SOURCE_SHA:releases/$RELEASE_DIRECTORY"
          git archive --format=zip -0             --prefix=bloomcore-triad-workflow-v0.1.0/             -o "$ASSET.b"             "$SOURCE_SHA:releases/$RELEASE_DIRECTORY"
          cmp -s "$ASSET.a" "$ASSET.b"
          mv "$ASSET.a" "$ASSET"
          ACTUAL_SHA256="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          echo "ACTUAL_SHA256=$ACTUAL_SHA256" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$ACTUAL_SHA256"
          unzip -t "$ASSET"
          test "$(unzip -Z1 "$ASSET" | wc -l)" -eq 46
          if unzip -Z1 "$ASSET" | grep -E '(^|/)(\.git|__pycache__|dist|build)(/|$)|2026-W37|bloomcore-scar'; then
            echo "unexpected archive member"
            exit 1
          fi
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Preserve the source. Bound the claim. Prove the work."
            echo
            echo "BLOOMCORE NOW W36 is **1 — ACTIVE**. This release turns the Triad pattern into a bounded, deterministic workflow package with explicit source roles, semantic authority, execution permissions, evidence gates, receipts, verification, and replay."
            echo
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- ZIP SHA-256: \`$ACTUAL_SHA256\`"
            echo "- Validation: 33/33 foundry tests; 17/17 W36 tests; license and boundary checks passed"
            echo "- Contents: exactly 46 archive members under \`bloomcore-triad-workflow-v0.1.0/\`"
            echo "- Boundary: no private Triad sources, private hashes, inventories, custody metadata, W37 work, or workspace residue"
            echo "- License lanes: code MPL-2.0; documentation CC BY-SA 4.0; repository tooling Apache-2.0"
            echo
            echo "Promotion: [PR #7](https://github.com/dkl101001/BLOOMCORE-NOW/pull/7)"
            echo "Post-merge receipt correction: [PR #8](https://github.com/dkl101001/BLOOMCORE-NOW/pull/8)"
            echo
            echo "This package does not claim native organism-wide truth, identity, custody, MANTIS, MIRRORSEED, or Unity Nexus authority."
          } > release-notes.md
          gh release create "$TAG" "$ASSET"             --target "$SOURCE_SHA"             --title "BLOOMCORE Triad-Derived Workflow v0.1.0"             --notes-file release-notes.md
