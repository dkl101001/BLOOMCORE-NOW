<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">FLOCK OFF: Bureaucracy. Now with more receipts.</title><desc id="desc">Cream paper, black typography, red tape and an unofficial stamp. Public questions. Inspectable software. Exceptional paperwork.</desc>
