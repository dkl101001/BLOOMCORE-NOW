<path d="M64 98H1536M64 650H1536" stroke="#22221f" stroke-width="2"/>
<g fill="#22221f" font-family="DejaVu Sans Mono, monospace" font-size="18"><text x="65" y="74">BLOOMCORE OI / SOFTWARE RELEASE</text><text x="1535" y="74" text-anchor="end">FORM FO-001 • RETAIN YOUR COPY</text></g>
<text x="57" y="309" fill="#20211f" font-family="DejaVu Sans, sans-serif" font-size="209" font-weight="bold" letter-spacing="-13">FLOCK OFF</text>
